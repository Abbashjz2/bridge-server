name: Build and Publish Bridge Image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: abbashjz2/billflow-bridge

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version without v prefix
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm/v7
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Publish release to Supabase
        shell: bash
        env:
          RELEASE_SECRET: ${{ secrets.BRIDGE_RELEASE_PUBLISH_SECRET }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          curl --fail-with-body --show-error --silent \
            -X POST \
            "https://vcabaubdlvjzeczfyfgc.supabase.co/functions/v1/bridge-publish-release" \
            -H "Content-Type: application/json" \
            -H "x-release-secret: ${RELEASE_SECRET}" \
            -d "{
              \"version\": \"${RELEASE_VERSION}\",
              \"docker_image\": \"ghcr.io/abbashjz2/billflow-bridge:${RELEASE_VERSION}\",
              \"release_notes\": \"Automated release ${RELEASE_VERSION}\"
            }"