      TENANT_ID: 759b6be6-9581-49cf-b09f-ee01dc7c4f17
      TERMINAL_PORT: "3066"
    hostname: bridge-server
    networks:
      default: null
    ports:
      - mode: ingress
        target: 3066
        published: "3066"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /home/pi/bridge-server
        target: /app
        bind: {}
      - type: volume
        target: /app/node_modules
        volume: {}
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
        bind: {}
      - type: bind
        source: /proc/device-tree/model
        target: /host/proc/device-tree/model
        read_only: true
        bind: {}
      - type: bind
        source: /etc/os-release
        target: /host/etc/os-release
        read_only: true
        bind: {}
      - type: bind
        source: /
        target: /host/root
        read_only: true
        bind: {}
networks:
  default:
    name: bridge-server_default
